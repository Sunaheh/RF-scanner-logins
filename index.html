<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
    }

    /* Fixed top header */
    .nav-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 52px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .nav-title {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #38bdf8;
    }

    /* Full-page snap sections for each gun */
    .page-section {
      height: 100vh;
      width: 100vw;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 68px 24px 28px;
      position: relative;
    }

    .card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      max-width: 900px;
      width: 100%;
      padding: 28px 36px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .scanner-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .gun-badge {
      background: #0284c7;
      color: #fff;
      font-size: 1.25rem;
      font-weight: 800;
      padding: 6px 18px;
      border-radius: 999px;
      letter-spacing: 0.05em;
    }

    .meta-tags {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      background: #0f172a;
      border: 1px solid #334155;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 6px;
      color: #94a3b8;
    }

    .badge strong {
      color: #f1f5f9;
    }

    /* Barcode Grid */
    .barcode-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    /* Barcode Card Box */
    .barcode-card {
      background: #ffffff;
      border: 2px solid transparent;
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
      position: relative;
    }

    .barcode-card:active {
      transform: scale(0.99);
    }

    /* Active Highlight */
    .barcode-card.active-barcode {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.35);
    }

    .barcode-label {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #475569;
      margin-bottom: 6px;
      align-self: flex-start;
      transition: color 0.15s ease;
    }

    .barcode-card.active-barcode .barcode-label {
      color: #0284c7;
    }

    /* Barcode SVG Container & vanishing magic */
    .barcode-svg-wrapper {
      width: 100%;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .barcode-svg {
      width: 100%;
      max-height: 90px;
      transition: opacity 0.15s ease;
    }

    /* When another barcode on the card is tapped, vanish the barcode lines */
    .barcode-card.vanished .barcode-svg {
      opacity: 0;
      visibility: hidden;
    }

    .barcode-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.05rem;
      font-weight: 700;
      color: #0f172a;
      margin-top: 6px;
      letter-spacing: 0.04em;
    }

    .barcode-card.vanished .barcode-val {
      color: #94a3b8;
    }

    /* Print styles */
    @media print {
      body {
        background: #fff;
        color: #000;
        overflow: visible;
      }
      .nav-header {
        display: none;
      }
      .page-section {
        height: auto;
        min-height: 100vh;
        page-break-after: always;
        break-after: page;
        padding: 40px;
      }
      .card {
        background: #fff;
        border: 1px solid #ccc;
        box-shadow: none;
        color: #000;
      }
      .barcode-card {
        border: 1px solid #ddd;
        box-shadow: none;
      }
      .barcode-card.vanished .barcode-svg {
        opacity: 1 !important;
        visibility: visible !important;
      }
      .badge {
        background: #f1f5f9;
        color: #334155;
        border-color: #cbd5e1;
      }
      .badge strong {
        color: #0f172a;
      }
    }
  </style>
</head>

    function isIgnored(val) {
      if (!val) return true;
      const v = val.toString().trim().toUpperCase();
      return v === '' || v === 'N/A' || v === 'NA' || v === 'SPARE';
    }

    const container = document.getElementById('pages-container');

    data.forEach((row, index) => {
      const section = document.createElement('section');
      section.className = 'page-section';
      section.id = `row-${index}`;

      const fields = [
        { label: 'Login', val: row.login },
        { label: 'Password', val: row.password },
        { label: 'Priority Login', val: row.p_login },
        { label: 'Priority Password', val: row.p_pass }
      ].filter(f => !isIgnored(f.val));

      let barcodesHtml = '';
      fields.forEach((f, fIdx) => {
        const svgId = `bc-${index}-${fIdx}`;
        barcodesHtml += `
          <div class="barcode-card" onclick="isolateBarcode(this)">
            <span class="barcode-label">${f.label}</span>
            <div class="barcode-svg-wrapper">
              <svg class="barcode-svg" id="${svgId}"></svg>
            </div>
            <span class="barcode-val">${f.val}</span>
          </div>
        `;
      });

      section.innerHTML = `
        <div class="card">
          <div class="card-header">
            <div class="scanner-info">
              <span class="gun-badge">GUN ${row.gun}</span>
            </div>
            <div class="meta-tags">

              <span class="badge">Account / Task: <strong>${row.task}</strong></span>
              <span class="badge">Printer: <strong>${row.printer}</strong></span>
            </div>
          </div>
          <div class="barcode-grid">
            ${barcodesHtml}
          </div>
        </div>
      `;

      container.appendChild(section);

      fields.forEach((f, fIdx) => {
        const svgId = `#bc-${index}-${fIdx}`;
        try {
          JsBarcode(svgId, f.val, {
            format: "CODE128",
            displayValue: false,
            margin: 0,
            height: 52,
            width: 2.2,
            lineColor: "#0f172a"
          });
        } catch (e) {
          console.error("Barcode render error:", e);
        }
      });
    });

    // Magic tap function
    function isolateBarcode(cardElement) {
      const grid = cardElement.closest('.barcode-grid');
      const allCards = grid.querySelectorAll('.barcode-card');
      const isAlreadyActive = cardElement.classList.contains('active-barcode');

      if (isAlreadyActive) {
        // Tapping the same card again brings all barcodes back
        allCards.forEach(card => {
          card.classList.remove('active-barcode', 'vanished');
        });
      } else {
        // Show ONLY the tapped barcode, vanish all other barcodes in the grid
        allCards.forEach(card => {
          if (card === cardElement) {
            card.classList.add('active-barcode');
            card.classList.remove('vanished');
          } else {
            card.classList.remove('active-barcode');
            card.classList.add('vanished');
          }
        });
      }
    }
